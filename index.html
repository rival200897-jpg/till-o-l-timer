<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer</title>
<style>
  :root {
    --bg: #f3f6f4;
    --surface: #ffffff;
    --ink: #14241f;
    --muted: #5d6f68;
    --accent: #0f7a5c;
    --accent-ink: #ffffff;
    --line: #d4ddd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1815;
      --surface: #16251f;
      --ink: #e8f1ed;
      --muted: #8fa59c;
      --accent: #3ecf9f;
      --accent-ink: #06231a;
      --line: #2a3d35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    padding: 16px;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .tabs button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 700;
  }
  .display {
    font-size: clamp(3rem, 16vw, 4.5rem);
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    margin: 8px 0 20px;
  }
  .display.done { color: var(--accent); }
  .inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .inputs label { font-size: 0.85rem; color: var(--muted); text-align: center; }
  .inputs input {
    display: block;
    width: 80px;
    margin-top: 4px;
    padding: 10px;
    font: inherit;
    font-size: 1.2rem;
    text-align: center;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .controls { display: flex; gap: 10px; }
  .controls button {
    flex: 1;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .controls .primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-countdown" aria-selected="true">Countdown</button>
    <button role="tab" id="tab-stopwatch" aria-selected="false">Stopwatch</button>
  </div>

  <div class="inputs" id="inputs">
    <label>Hours<input type="number" id="h" min="0" max="99" value="0"></label>
    <label>Minutes<input type="number" id="m" min="0" max="59" value="5"></label>
    <label>Seconds<input type="number" id="s" min="0" max="59" value="0"></label>
  </div>

  <div class="display" id="display" aria-live="off">00:05:00</div>

  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="reset">Reset</button>
  </div>
</main>

<script>
  var mode = "countdown";
  var running = false;
  var tick = null;
  var remaining = 0;   // countdown, ms
  var elapsed = 0;     // stopwatch, ms
  var lastTime = 0;

  var display = document.getElementById("display");
  var startBtn = document.getElementById("start");
  var resetBtn = document.getElementById("reset");
  var inputs = document.getElementById("inputs");
  var hEl = document.getElementById("h");
  var mEl = document.getElementById("m");
  var sEl = document.getElementById("s");

  function pad(n) { return String(n).padStart(2, "0"); }

  function format(ms) {
    var total = Math.ceil(ms / 1000);
    var hh = Math.floor(total / 3600);
    var mm = Math.floor((total % 3600) / 60);
    var ss = total % 60;
    return pad(hh) + ":" + pad(mm) + ":" + pad(ss);
  }

  function formatStopwatch(ms) {
    var total = Math.floor(ms / 1000);
    var hh = Math.floor(total / 3600);
    var mm = Math.floor((total % 3600) / 60);
    var ss = total % 60;
    return pad(hh) + ":" + pad(mm) + ":" + pad(ss);
  }

  function inputMs() {
    var h = parseInt(hEl.value, 10) || 0;
    var m = parseInt(mEl.value, 10) || 0;
    var s = parseInt(sEl.value, 10) || 0;
    return ((h * 60 + m) * 60 + s) * 1000;
  }

  function render() {
    display.textContent = mode === "countdown" ? format(remaining) : formatStopwatch(elapsed);
  }

  function stop() {
    running = false;
    clearInterval(tick);
    startBtn.textContent = "Start";
  }

  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start();
      setTimeout(function () { osc.stop(); ctx.close(); }, 600);
    } catch (e) {}
  }

  function loop() {
    var now = Date.now();
    var delta = now - lastTime;
    lastTime = now;
    if (mode === "countdown") {
      remaining -= delta;
      if (remaining <= 0) {
        remaining = 0;
        stop();
        display.classList.add("done");
        beep();
      }
    } else {
      elapsed += delta;
    }
    render();
  }

  function start() {
    if (running) { stop(); return; }
    if (mode === "countdown" && remaining <= 0) {
      remaining = inputMs();
      if (remaining <= 0) return;
    }
    display.classList.remove("done");
    running = true;
    lastTime = Date.now();
    tick = setInterval(loop, 200);
    startBtn.textContent = "Pause";
  }

  function reset() {
    stop();
    display.classList.remove("done");
    remaining = mode === "countdown" ? inputMs() : 0;
    elapsed = 0;
    render();
  }

  function setMode(next) {
    mode = next;
    stop();
    document.getElementById("tab-countdown").setAttribute("aria-selected", next === "countdown");
    document.getElementById("tab-stopwatch").setAttribute("aria-selected", next === "stopwatch");
    inputs.hidden = next !== "countdown";
    reset();
  }

  document.getElementById("tab-countdown").onclick = function () { setMode("countdown"); };
  document.getElementById("tab-stopwatch").onclick = function () { setMode("stopwatch"); };
  startBtn.onclick = start;
  resetBtn.onclick = reset;
  [hEl, mEl, sEl].forEach(function (el) {
    el.oninput = function () { if (!running) { remaining = inputMs(); render(); } };
  });

  reset();
</script>
</body>
</html>
